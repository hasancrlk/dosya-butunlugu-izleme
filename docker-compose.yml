services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    # No published port: the database is reachable only from the app network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  fim-sentinel:
    build: .
    env_file: .env
    environment:
      FIM_DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      FIM_ALLOWED_PATHS: '["/watch"]'
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./watch:/watch:ro

volumes:
  pgdata:
